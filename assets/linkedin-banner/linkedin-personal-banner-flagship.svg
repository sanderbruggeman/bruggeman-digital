        <text x="20" y="27" font-family="Plus Jakarta Sans" font-size="15" font-weight="700" fill="#10B981">✓</text>
        <text x="38" y="27" font-family="Inter" font-size="14.5" font-weight="600" fill="#E2E8F0">Geen vaste contracten</text>
