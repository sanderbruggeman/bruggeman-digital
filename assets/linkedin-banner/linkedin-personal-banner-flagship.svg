    <radialGradient id="orangeGlowP" cx="95%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#FF6A2B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF6A2B" stop-opacity="0"/>
